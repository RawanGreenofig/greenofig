<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Greenofig</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d1a12;
        color: #f0ede6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
      }
      .brand {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .accent { color: #a3e635; }
      .sub {
        font-size: 13px;
        color: #9baf9f;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(163, 230, 53, 0.25);
        border-top-color: #a3e635;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="brand">Greeno<span class="accent">fig</span></div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="sub">Loading your nutrition coach…</div>
    </div>
  </body>
</html>
