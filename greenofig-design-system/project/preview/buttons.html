<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font:500 14px/1 var(--font-sans); border-radius:8px; padding:0 16px; height:40px; border:1px solid transparent; cursor:pointer; transition:all 200ms ease; white-space:nowrap; }
.btn svg { width:16px; height:16px; }
.btn-primary { background:#84cc16; color:#fff; box-shadow:0 4px 14px rgb(132 204 22 / 0.25); }
.btn-primary.glow { box-shadow:0 4px 20px rgb(163 230 53 / 0.5); }
.btn-secondary { background:#f1f5f9; color:#0f172a; }
.btn-outline { background:#fff; color:#0f172a; border-color:#e2e8f0; }
.btn-ghost { background:transparent; color:#0f172a; }
.btn-destructive { background:#ef4444; color:#fff; }
.btn-lg { height:48px; padding:0 24px; font-size:15px; border-radius:8px; }
.btn-sm { height:32px; padding:0 12px; font-size:13px; }
</style></head>
<body><div class="card" style="gap:14px">
  <div class="row" style="gap:10px;flex-wrap:wrap">
    <button class="btn btn-primary glow">Get Started <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
    <button class="btn btn-outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/></svg> Watch Demo</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-ghost">Learn more</button>
    <button class="btn btn-destructive">Delete</button>
  </div>
  <div class="row" style="gap:10px;flex-wrap:wrap;align-items:center">
    <button class="btn btn-primary btn-lg">Start Free Trial</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary" disabled style="opacity:0.5;cursor:not-allowed">Disabled</button>
  </div>
  <div class="mono" style="font-size:11px;color:#64748b">Primary uses lime-glow shadow on hover/active · 8px radius · 40/48/32 heights · Inter 500</div>
</div></body></html>
