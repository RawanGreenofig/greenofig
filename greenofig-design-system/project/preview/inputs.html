<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.field { display:flex; flex-direction:column; gap:6px; flex:1; }
.field > label { font:500 13px/1 var(--font-sans); color:#0f172a; }
.input { height:40px; padding:0 12px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; font:400 14px/1 var(--font-sans); color:#0f172a; outline:none; transition:all 150ms ease; }
.input:focus { border-color:#84cc16; box-shadow:0 0 0 3px rgb(132 204 22 / 0.2); }
.input.has-icon { padding-left:36px; }
.input-wrap { position:relative; }
.input-wrap > svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:#64748b; pointer-events:none; }

/* Polished subscribe row */
.subscribe {
  display:flex; align-items:center; gap:14px;
  padding:14px 16px;
  background:linear-gradient(135deg, rgba(132,204,22,0.08), rgba(132,204,22,0.02));
  border:1px solid rgba(132,204,22,0.25);
  border-radius:12px;
  cursor:pointer;
  transition:all 200ms ease;
}
.subscribe:hover { border-color:rgba(132,204,22,0.45); background:linear-gradient(135deg, rgba(132,204,22,0.12), rgba(132,204,22,0.04)); }
.subscribe-check {
  width:22px; height:22px; border-radius:6px;
  background:#84cc16;
  display:inline-flex; align-items:center; justify-content:center;
  flex-shrink:0;
  box-shadow:0 2px 6px rgb(132 204 22 / 0.35);
}
.subscribe-check svg { width:14px; height:14px; color:#fff; }
.subscribe-text { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
.subscribe-title { font:600 14px/1.3 var(--font-sans); color:#0f172a; }
.subscribe-sub { font:400 12px/1.4 var(--font-sans); color:#64748b; }
.subscribe-meta { font:500 11px/1 var(--font-sans); color:#65a30d; padding:4px 8px; border-radius:9999px; background:rgba(132,204,22,0.15); flex-shrink:0; white-space:nowrap; }

/* Toggle */
.toggle-row { display:flex; align-items:center; gap:10px; }
.toggle { width:36px; height:20px; background:#84cc16; border-radius:9999px; position:relative; flex-shrink:0; cursor:pointer; box-shadow:inset 0 1px 2px rgb(0 0 0 / 0.1); }
.toggle::after { content:''; position:absolute; top:2px; left:18px; width:16px; height:16px; background:#fff; border-radius:9999px; box-shadow:0 1px 3px rgb(0 0 0 / 0.2); transition:left 200ms ease; }
.toggle-label { font:500 13px/1 var(--font-sans); color:#0f172a; }

/* Segmented */
.segmented { display:inline-flex; padding:4px; background:#f1f5f9; border-radius:9999px; gap:2px; }
.seg { padding:6px 14px; border-radius:9999px; font:500 13px/1 var(--font-sans); color:#64748b; cursor:pointer; }
.seg.active { background:#fff; color:#0f172a; box-shadow:0 1px 3px rgb(0 0 0 / 0.08); }
</style></head>
<body><div class="card" style="gap:14px">
  <div class="row" style="gap:12px">
    <div class="field">
      <label>Email</label>
      <div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg><input class="input has-icon" placeholder="you@greenofig.com" value="sarah@gmail.com"></div>
    </div>
    <div class="field">
      <label>Password</label>
      <input class="input" type="password" value="••••••••••">
    </div>
  </div>

  <!-- Polished subscribe -->
  <label class="subscribe">
    <span class="subscribe-check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </span>
    <span class="subscribe-text">
      <span class="subscribe-title">Subscribe to weekly tips</span>
      <span class="subscribe-sub">Recipes, gentle nudges, and what's in season — every Sunday.</span>
    </span>
    <span class="subscribe-meta">Free</span>
  </label>

  <div class="row" style="gap:24px;align-items:center">
    <div class="toggle-row">
      <div class="toggle"></div>
      <span class="toggle-label">Push notifications</span>
    </div>
    <div class="segmented">
      <span class="seg active">Monthly</span>
      <span class="seg">Yearly · save 20%</span>
    </div>
  </div>
</div></body></html>
