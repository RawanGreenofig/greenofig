<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.badge { display:inline-flex; align-items:center; gap:4px; font:600 12px/1 var(--font-sans); padding:4px 10px; border-radius:9999px; }
.badge svg { width:12px; height:12px; }
</style></head>
<body><div class="card" style="gap:14px">
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
    <span class="badge" style="background:#84cc16;color:#fff">Premium</span>
    <span class="badge" style="background:rgba(132,204,22,0.15);color:#4d7c0f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>Active</span>
    <span class="badge" style="background:#f1f5f9;color:#0f172a">Free</span>
    <span class="badge" style="background:rgba(245,158,11,0.15);color:#b45309">Pending</span>
    <span class="badge" style="background:rgba(239,68,68,0.15);color:#b91c1c">Overdue</span>
    <span class="badge" style="background:rgba(14,165,233,0.15);color:#0369a1">Info</span>
  </div>
  <div class="row" style="gap:8px;flex-wrap:wrap;align-items:center">
    <span class="badge" style="background:#0f172a;color:#fff">Most Popular</span>
    <span class="badge" style="background:linear-gradient(90deg,#84cc16,#a3e635);color:#fff"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>Featured</span>
    <span class="badge" style="background:#fafaf7;color:#64748b;border:1px solid #e2e8f0">Tag</span>
    <span class="badge" style="background:rgba(168,85,247,0.15);color:#7c3aed">Beta</span>
  </div>
  <div class="mono" style="font-size:11px;color:#64748b">Pills · 12px / 600 · 4px·10px padding · tinted-bg variants use 15% alpha</div>
</div></body></html>
