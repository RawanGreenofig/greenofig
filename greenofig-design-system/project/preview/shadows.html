<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:#fafaf7;padding:32px">
  <div style="display:flex;gap:20px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0 / 0.05)"></div>
      <div class="mono">shadow-sm · resting</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)"></div>
      <div class="mono">shadow-md</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)"></div>
      <div class="mono">shadow-lg</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div style="width:120px;height:80px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgb(163 230 53 / 0.5)"></div>
      <div class="mono">shadow-glow ★</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div style="width:120px;height:80px;background:rgba(255,255,255,0.6);backdrop-filter:blur(20px);border:1px solid rgba(226,232,240,0.5);border-radius:12px;box-shadow:0 10px 40px rgb(0 0 0 / 0.15)"></div>
      <div class="mono">glass-effect</div>
    </div>
  </div>
</div></body></html>
