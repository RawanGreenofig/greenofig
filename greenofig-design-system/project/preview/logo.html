<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="gap:18px">
  <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap">
    <img src="../assets/logo.png" alt="GreenoFig" style="height:96px;width:auto">
    <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-start">
      <img src="../assets/logo.png" alt="" style="height:40px"><span class="mono">h-10 · navbar / footer</span>
      <img src="../assets/logo.png" alt="" style="height:32px"><span class="mono">h-8 · app sidebar</span>
      <img src="../assets/logo.png" alt="" style="height:24px"><span class="mono">h-6 · in-text mark</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;background:#0d1a12;padding:18px;border-radius:12px">
      <img src="../assets/logo.png" alt="" style="height:64px;filter:brightness(1.1)">
      <span class="mono" style="color:#a3e635;font-size:10px">on deep-forest</span>
    </div>
  </div>
  <div class="mono" style="font-size:11px;color:#64748b">GF monogram · leaves above · roots + figs below · always full-color · never recolored or used as one-color mark</div>
</div></body></html>
