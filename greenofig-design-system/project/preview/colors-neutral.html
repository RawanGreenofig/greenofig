<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row">
    <div class="swatch light" style="background:#ffffff"><div class="name">paper</div><div class="hex">#FFFFFF · --background</div></div>
    <div class="swatch light" style="background:#fafaf7"><div class="name">cream</div><div class="hex">#FAFAF7</div></div>
    <div class="swatch light" style="background:#f1f5f9"><div class="name">muted (sec.)</div><div class="hex">hsl(210 40% 96%)</div></div>
    <div class="swatch light" style="background:#e2e8f0"><div class="name">line / border</div><div class="hex">#E2E8F0</div></div>
  </div>
  <div class="row">
    <div class="swatch dark" style="background:#64748b"><div class="name">slate / fg-2</div><div class="hex">#64748B · muted-fg</div></div>
    <div class="swatch dark" style="background:#334155"><div class="name">ink / 700</div><div class="hex">#334155</div></div>
    <div class="swatch dark" style="background:#0f172a"><div class="name">ink / fg-1</div><div class="hex">#0F172A · foreground</div></div>
    <div class="swatch dark" style="background:#15171c"><div class="name">night / dark-bg</div><div class="hex">#15171C</div></div>
  </div>
</div></body></html>
