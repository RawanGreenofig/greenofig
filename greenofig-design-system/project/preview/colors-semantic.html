<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="row">
    <div class="swatch dark" style="background:#16a34a"><div class="name">success</div><div class="hex">#16A34A</div></div>
    <div class="swatch dark" style="background:#f59e0b;color:#1a2e05"><div class="name" style="color:#1a2e05">warning</div><div class="hex" style="color:#1a2e05">#F59E0B</div></div>
    <div class="swatch dark" style="background:#0ea5e9"><div class="name">info</div><div class="hex">#0EA5E9</div></div>
    <div class="swatch dark" style="background:#ef4444"><div class="name">danger</div><div class="hex">#EF4444</div></div>
  </div>
  <div class="label">Stat-icon hues — dashboard only</div>
  <div class="row">
    <div class="swatch dark" style="background:#f97316"><div class="name">flame · calories</div><div class="hex">orange-500</div></div>
    <div class="swatch dark" style="background:#3b82f6"><div class="name">target · protein</div><div class="hex">blue-500</div></div>
    <div class="swatch dark" style="background:#06b6d4"><div class="name">droplets · water</div><div class="hex">cyan-500</div></div>
    <div class="swatch dark" style="background:#a855f7"><div class="name">moon · sleep</div><div class="hex">purple-500</div></div>
  </div>
</div></body></html>
