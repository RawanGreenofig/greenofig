<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="background:#fafaf7;padding:24px;gap:16px">
  <div class="row" style="gap:16px">
    <!-- Standard card -->
    <div style="flex:1;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 2px 0 rgb(0 0 0 / 0.05);padding:20px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(132,204,22,0.12);display:flex;align-items:center;justify-content:center;color:#65a30d">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12c0-4.97 4.03-9 9-9s9 4.03 9 9-4.03 9-9 9-9-4.03-9-9zM12 8v4l3 3"/></svg>
        </div>
        <div>
          <div style="font:600 16px/1.2 var(--font-sans)">Workout Streak</div>
          <div style="font:400 13px/1.4 var(--font-sans);color:#64748b">7 days in a row</div>
        </div>
      </div>
      <div style="font:700 32px/1 var(--font-sans);color:#0f172a">7 <span style="font:400 14px var(--font-sans);color:#64748b">days</span></div>
    </div>
    <!-- Gradient feature card -->
    <div style="flex:1;background:linear-gradient(135deg,rgba(132,204,22,0.12),rgba(132,204,22,0.04));border:1px solid rgba(132,204,22,0.25);border-radius:12px;padding:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font:600 16px/1.2 var(--font-sans)">Upgrade to Premium</div>
        <span style="font:600 11px/1 var(--font-sans);padding:4px 10px;border-radius:9999px;background:#84cc16;color:#fff">PRO</span>
      </div>
      <div style="font:400 13px/1.5 var(--font-sans);color:#475569;margin-bottom:14px">Unlock AI coaching, nutritionist access, and more.</div>
      <button style="height:34px;padding:0 14px;background:#84cc16;color:#fff;border:0;border-radius:8px;font:500 13px var(--font-sans);cursor:pointer">Upgrade</button>
    </div>
  </div>
  <div class="mono" style="font-size:11px;color:#64748b">Cards · bg-card · 12px radius · shadow-sm rest → -translate-y-1 + shadow-glow on hover. Variant: from-primary/10 → primary/5 with primary/20 border.</div>
</div></body></html>
