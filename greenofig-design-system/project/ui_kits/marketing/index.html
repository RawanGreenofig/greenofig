<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280" />
<title>GreenoFig — Eat Better.</title>
<link rel="icon" href="../../assets/favicon-32x32.png" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  /* ── Marketing-site overlay system ─────────────────────────────────── */
  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(ellipse 1200px 600px at 50% 0%, rgba(13,58,46,0.06), transparent 70%),
      radial-gradient(ellipse 800px 500px at 100% 30%, rgba(245,158,11,0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 0% 70%, rgba(132,204,22,0.06), transparent 65%),
      linear-gradient(180deg, #f6f5ed 0%, #fafaf7 40%, #fafaf7 100%);
  }

  /* Film grain overlay (8% per spec) */
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.06;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
  }

  .grad {
    background: linear-gradient(90deg, var(--gf-lime-500), var(--gf-lime-400));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ── Buttons ───────────────────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 20px; border-radius: 10px;
    font: 500 14px/1 var(--font-sans);
    border: 1px solid transparent; cursor: pointer;
    transition: all 250ms var(--ease-out);
    white-space: nowrap;
  }
  .btn-lg { height: 52px; padding: 0 28px; font-size: 15px; border-radius: 12px; }
  .btn-primary { background: var(--gf-lime-500); color: #fff; }
  .btn-primary:hover { background: var(--gf-lime-600); transform: translateY(-1px); }

  /* Polished primary pill — used in nav. Lime gradient + arrow micro-interaction. */
  .btn-pill-primary {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 18px 0 20px;
    border-radius: 9999px;
    background: linear-gradient(180deg, #a3e635, #65a30d);
    color: #0d1a12;
    font: 600 13px/1 var(--font-sans);
    letter-spacing: -0.005em;
    border: 1px solid rgba(101,163,13,0.6);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.4) inset,
      0 -1px 0 rgba(0,0,0,0.1) inset,
      0 6px 18px rgba(132,204,22,0.4),
      0 1px 2px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
    white-space: nowrap;
  }
  .btn-pill-primary:hover {
    transform: translateY(-1px);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 -1px 0 rgba(0,0,0,0.1) inset,
      0 10px 28px rgba(132,204,22,0.5),
      0 2px 4px rgba(0,0,0,0.08);
  }
  .btn-pill-primary:active { transform: translateY(0); }
  .btn-pill-primary svg {
    transition: transform 240ms var(--ease-out);
  }
  .btn-pill-primary:hover svg { transform: translateX(3px); }

  .glow { box-shadow: 0 6px 24px rgb(163 230 53 / 0.45); }
  .glow:hover { box-shadow: 0 10px 36px rgb(163 230 53 / 0.6); }
  .glow-sm { box-shadow: 0 4px 14px rgb(163 230 53 / 0.35); }
  .btn-glass { background: rgba(255,255,255,0.08); color: #fafaf7; border-color: rgba(255,255,255,0.18); backdrop-filter: blur(12px); }
  .btn-glass:hover { background: rgba(255,255,255,0.16); }
  .btn-outline-dark { background: transparent; color: var(--gf-ink); border-color: var(--gf-ink); }
  .btn-outline-dark:hover { background: var(--gf-ink); color: #fff; }
  .btn-ghost-light { background: transparent; border: 0; padding: 10px 14px; font: 500 14px/1 var(--font-sans); cursor: pointer; }

  /* ── Nav glass ─────────────────────────────────────────────────────── */
  .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226,232,240,0.5); }
  .shadow-glass { box-shadow: 0 6px 32px rgb(0 0 0 / 0.06); }
  .site-nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 50;
    transition: all 300ms var(--ease-out);
  }
  .site-nav-inner {
    max-width: 1280px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
  }
  .site-nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .site-nav-links { display: flex; align-items: center; gap: 32px; }
  .site-nav-links a { text-decoration: none; }
  .site-nav-cta { display: flex; align-items: center; gap: 12px; }
  @media (max-width: 720px) {
    .site-nav-links { display: none; }
  }
  .footer-brand-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }

  /* ── Scrolling fruit-to-juice background ───────────────────────────── */
  .fruit-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .fruit {
    position: absolute;
    width: 100px; height: 100px;
    will-change: transform, opacity;
  }
  .fruit svg { width: 100%; height: 100%; display: block; }

  /* Sections need to sit above the bg */
  .section, .hero-frame, .site-footer { position: relative; z-index: 1; }
  .hero-frame {
    background: var(--gf-forest-deep);
    margin: 16px;
    border-radius: 28px;
    overflow: hidden;
    position: relative;
    min-height: calc(100vh - 32px);
    display: flex; align-items: center; justify-content: center;
    color: var(--gf-cream);
  }
  .hero-frame::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 800px 600px at 30% 20%, rgba(132,204,22,0.18), transparent 60%),
      radial-gradient(ellipse 600px 500px at 80% 90%, rgba(245,158,11,0.12), transparent 60%);
    pointer-events: none;
  }
  .hero-inner {
    position: relative; z-index: 5;
    max-width: 1100px; padding: 140px 40px 120px;
    text-align: center;
  }
  .hero-eyebrow {
    display: inline-block;
    padding: 8px 16px; border-radius: 9999px;
    background: rgba(163,230,53,0.12);
    border: 1px solid rgba(163,230,53,0.3);
    color: var(--gf-lime-400);
    font: 600 12px/1 var(--font-sans);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .hero-headline {
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'opsz' 144, 'wght' 600, 'SOFT' 100, 'WONK' 1;
    font-size: clamp(72px, 13vw, 180px);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: #fafaf7;
    margin: 0 0 32px;
    display: flex; justify-content: center; gap: 0.3em;
    flex-wrap: wrap;
  }
  .hero-word { display: inline-block; }
  .hero-sub {
    max-width: 620px; margin: 0 auto 40px;
    font: 400 19px/1.55 var(--font-sans);
    color: rgba(250,250,247,0.72);
  }
  .hero-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; position: relative; z-index: 6; }
  .hero-trust {
    margin-top: 28px;
    font: 400 13px/1 var(--font-sans);
    color: rgba(250,250,247,0.5);
    letter-spacing: 0.02em;
  }
  .scroll-cue {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    font: 500 11px/1 var(--font-sans);
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(250,250,247,0.5);
    z-index: 3;
  }
  .scroll-cue-dot {
    width: 24px; height: 38px;
    border: 1.5px solid rgba(250,250,247,0.4);
    border-radius: 14px;
    position: relative;
  }
  .scroll-cue-dot::after {
    content: ''; position: absolute;
    top: 8px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 8px; background: var(--gf-lime-400);
    border-radius: 2px;
    animation: cueFall 1.8s var(--ease-out) infinite;
  }
  @keyframes cueFall {
    0% { transform: translate(-50%, 0); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translate(-50%, 14px); opacity: 0; }
  }

  /* Floating glass info cards */
  .float-card {
    position: absolute; z-index: 2;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    min-width: 180px;
    animation: floatY 4s ease-in-out infinite;
    animation-delay: 0s;
    pointer-events: none;
  }
  .float-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .float-tl { top: 90px; left: 32px; }
  .float-tr { top: 110px; right: 32px; }
  .float-bl { bottom: 80px; left: 32px; }
  .float-br { bottom: 100px; right: 32px; }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Floating ingredient photos */
  .ingredient {
    position: absolute;
    border-radius: 50%;
    background-size: cover; background-position: center;
    box-shadow: 0 30px 60px rgb(0 0 0 / 0.4), inset 0 0 40px rgb(0 0 0 / 0.1);
    z-index: 1;
    pointer-events: none;
  }
  .ing-1 { width: 180px; height: 180px; top: 6%; right: 4%; animation: floatY 6s ease-in-out infinite; }
  .ing-2 { width: 130px; height: 130px; bottom: 8%; left: 4%; animation: floatY 5s ease-in-out infinite reverse; animation-delay: -1s; }
  .ing-3 { width: 80px; height: 80px; top: 18%; left: 6%; animation: floatY 4.5s ease-in-out infinite; animation-delay: -2s; }

  /* Hero text/CTA elements explicitly above floating decorations */
  .hero-eyebrow,
  .hero-headline,
  .hero-sub,
  .hero-ctas,
  .hero-trust { position: relative; z-index: 10; }

  /* ── SECTIONS ──────────────────────────────────────────────────────── */
  .section { padding: 120px 0; position: relative; }
  .section-inner { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
  .eyebrow {
    font: 600 12px/1 var(--font-sans);
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gf-lime-500);
  }
  .section-title {
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'opsz' 96, 'wght' 500, 'SOFT' 100, 'WONK' 1;
    font-size: clamp(40px, 5vw, 68px);
    line-height: 1.05;
    letter-spacing: -0.025em;
    text-align: center;
    color: var(--gf-ink);
    margin: 0 auto 16px;
    max-width: 800px;
  }
  .section-sub {
    text-align: center; max-width: 560px; margin: 0 auto 64px;
    font: 400 18px/1.6 var(--font-sans);
    color: var(--fg-2);
  }

  /* Features */
  .section-features { background: var(--gf-paper); }
  .feature-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
  }
  .feature-card {
    background: var(--gf-paper);
    border: 1px solid var(--line-1);
    border-radius: 20px;
    padding: 28px;
    transition: all 350ms var(--ease-out);
  }
  .feature-card:hover {
    transform: translateY(-6px);
    border-color: rgba(132,204,22,0.4);
    box-shadow: 0 20px 40px rgb(132 204 22 / 0.12);
  }
  .feature-icon {
    width: 52px; height: 52px; border-radius: 14px;
    background: rgba(132,204,22,0.12);
    color: var(--gf-lime-600);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .feature-title { font: 600 19px/1.3 var(--font-sans); margin-bottom: 8px; }
  .feature-body { font: 400 14px/1.6 var(--font-sans); color: var(--fg-2); }

  /* Showcase */
  .section-showcase {
    background: var(--gf-forest-deep);
    color: var(--gf-cream);
    overflow: hidden;
  }
  .section-showcase .section-title { color: #fafaf7; text-align: left; max-width: 100%; }
  .showcase-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center;
  }
  .showcase-stage {
    position: relative; aspect-ratio: 1; max-width: 520px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto;
  }
  .burst {
    position: absolute; inset: -10%;
    border-radius: 50%;
    transition: background 800ms var(--ease-out);
    z-index: 0;
    animation: burstPulse 4s ease-in-out infinite;
  }
  @keyframes burstPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  .bottle {
    position: relative; z-index: 2;
    width: 180px; height: 320px;
    animation: bottleSpin 18s linear infinite;
  }
  @keyframes bottleSpin {
    0%, 100% { transform: rotateY(0deg); }
    50% { transform: rotateY(15deg); }
  }
  .bottle-cap {
    width: 110px; height: 38px;
    margin: 0 auto;
    background: linear-gradient(180deg, #1a2e05, #0d1a12);
    border-radius: 8px 8px 4px 4px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .bottle-body {
    width: 180px; height: 280px;
    background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(250,250,247,0.85));
    border-radius: 24px 24px 32px 32px;
    box-shadow: inset -20px 0 30px rgba(0,0,0,0.08), inset 20px 0 30px rgba(255,255,255,0.5), 0 30px 60px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    margin-top: -2px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .bottle-label {
    width: 130px;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(132,204,22,0.3);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .bottle-shadow {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    width: 60%; height: 24px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,0.4), transparent 70%);
    filter: blur(8px);
  }

  .orbit {
    position: absolute; z-index: 3;
    width: 90px; height: 90px;
    border-radius: 50%;
    background-size: cover; background-position: center;
    box-shadow: 0 20px 40px rgb(0 0 0 / 0.4);
    transition: all 600ms var(--ease-out);
    cursor: pointer;
  }
  .orbit-0 { top: 8%; left: 4%; }
  .orbit-1 { top: 12%; right: 6%; }
  .orbit-2 { bottom: 14%; left: 8%; width: 70px; height: 70px; }
  .orbit-3 { bottom: 8%; right: 4%; width: 80px; height: 80px; }
  .orbit-active {
    transform: scale(1.2);
    box-shadow: 0 0 0 4px var(--accent), 0 30px 60px rgb(0 0 0 / 0.5);
  }
  .orbit:not(.orbit-active) { opacity: 0.6; }

  .showcase-text { color: var(--gf-cream); }
  .ingredient-detail { margin-bottom: 32px; min-height: 60px; }
  .ingredient-detail-name {
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'opsz' 72, 'wght' 500, 'WONK' 1;
    font-size: 36px; line-height: 1; letter-spacing: -0.02em;
    color: #fafaf7;
    margin-bottom: 6px;
  }
  .ingredient-detail-tag {
    font: 500 14px/1 var(--font-sans);
    letter-spacing: 0.06em; text-transform: uppercase;
    transition: color 800ms var(--ease-out);
  }
  .ingredient-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .ing-pill {
    padding: 8px 16px; border-radius: 9999px;
    background: transparent; border: 1px solid rgba(250,250,247,0.2);
    color: rgba(250,250,247,0.7);
    font: 500 13px/1 var(--font-sans);
    cursor: pointer;
    transition: all 300ms var(--ease-out);
  }
  .ing-pill:hover { color: #fafaf7; border-color: rgba(250,250,247,0.5); }

  /* Stats */
  .section-stats {
    background: linear-gradient(180deg, var(--gf-cream) 0%, #fff7ed 100%);
  }
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 64px; }
  .stat {
    position: relative; aspect-ratio: 4/5;
    border-radius: 20px; overflow: hidden;
    background: var(--gf-ink);
    color: #fafaf7;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 24px;
  }
  .stat-img { position: absolute; inset: 0; background-size: cover; background-position: center; transform: scale(1.05); transition: transform 700ms var(--ease-out); }
  .stat:hover .stat-img { transform: scale(1.12); }
  .stat-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.1) 30%, rgba(0,0,0,0.85) 100%); }
  .stat-num {
    position: relative; z-index: 2;
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'opsz' 96, 'wght' 500, 'WONK' 1;
    font-size: clamp(48px, 5vw, 72px);
    line-height: 1; letter-spacing: -0.03em;
  }
  .stat-label {
    position: relative; z-index: 2;
    font: 400 14px/1.4 var(--font-sans);
    color: rgba(250,250,247,0.75);
    margin-top: 8px;
  }

  /* Story */
  .section-story { background: var(--gf-paper); padding: 140px 0; }
  .story-grid { display: grid; grid-template-columns: 5fr 7fr; gap: 80px; align-items: center; }
  .portrait-wrap { position: relative; aspect-ratio: 3/4; border-radius: 24px; overflow: hidden; }
  .portrait { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .portrait-warm { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(132,204,22,0.15)), linear-gradient(90deg, rgba(245,158,11,0.08), transparent); mix-blend-mode: multiply; }
  .portrait-sig {
    position: absolute; bottom: 24px; left: 24px; right: 24px;
    padding: 16px; border-radius: 14px;
    background: rgba(13,26,18,0.7); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .story-text { color: var(--gf-ink); }
  .story-lines { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  .story-line {
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'opsz' 72, 'wght' 400, 'SOFT' 50, 'WONK' 1;
    font-size: 22px; line-height: 1.5;
    color: var(--fg-1);
    font-style: italic;
  }

  /* Footer */
  .site-footer {
    background: var(--gf-forest-deeper);
    color: rgba(250,250,247,0.7);
    padding: 96px 0 0;
    overflow: hidden;
    position: relative;
  }
  .footer-content { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
  .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; padding-bottom: 64px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .foot-col-title { font: 600 12px/1 var(--font-sans); letter-spacing: 0.16em; text-transform: uppercase; color: rgba(250,250,247,0.5); margin-bottom: 16px; }
  .foot-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .foot-col a { font: 400 14px/1 var(--font-sans); color: rgba(250,250,247,0.7); text-decoration: none; transition: color 200ms; }
  .foot-col a:hover { color: var(--gf-lime-400); }
  .footer-meta {
    padding: 24px 0;
    display: flex; justify-content: space-between;
    font: 400 13px/1 var(--font-sans); color: rgba(250,250,247,0.4);
  }
  .social-row { display: flex; gap: 8px; margin-top: 20px; }
  .social-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255,255,255,0.06); color: rgba(250,250,247,0.7);
    display: flex; align-items: center; justify-content: center;
    transition: all 200ms;
  }
  .social-icon:hover { background: var(--gf-lime-500); color: #fff; }
  .footer-wordmark-wrap {
    width: 100%; overflow: hidden; line-height: 0;
    margin-top: 40px;
  }
  .footer-wordmark {
    font-family: 'Fraunces', Georgia, serif;
    font-variation-settings: 'opsz' 144, 'wght' 700, 'SOFT' 100, 'WONK' 1;
    font-size: clamp(120px, 18vw, 280px);
    line-height: 0.85;
    letter-spacing: -0.04em;
    color: transparent;
    -webkit-text-stroke: 1.5px rgba(132,204,22,0.4);
    text-align: center;
    user-select: none;
    background: linear-gradient(180deg, transparent 0%, rgba(132,204,22,0.06) 100%);
    -webkit-background-clip: text; background-clip: text;
    padding: 0 20px 20px;
  }

  /* Responsive (kit is 1280-first; below that we just degrade gracefully) */
  @media (max-width: 900px) {
    .feature-grid, .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .showcase-grid, .story-grid, .footer-grid { grid-template-columns: 1fr; }
  }

  /* prefers-reduced-motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-screen-label="Marketing Site">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="FruitBackground.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Features.jsx"></script>
  <script type="text/babel" src="IngredientShowcase.jsx"></script>
  <script type="text/babel" src="Stats.jsx"></script>
  <script type="text/babel" src="NutritionistStory.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>

  <script type="text/babel">
    function App() {
      const [scrolled, setScrolled] = React.useState(false);
      React.useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);
      return (
        <>
          <FruitBackground />
          <Nav scrolled={scrolled} />
          <Hero />
          <Features />
          <IngredientShowcase />
          <Stats />
          <NutritionistStory />
          <Footer />
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
