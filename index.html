<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GreenoFig - Your Professional Health Companion. Achieve your wellness goals with personalized nutrition, fitness, and lifestyle coaching." />
    <meta name="keywords" content="health, wellness, nutrition, fitness, diet, meal planning, workout, AI coach" />
    <meta name="author" content="GreenoFig" />
    <meta name="theme-color" content="#65a30d" />

    <!-- Open Graph -->
    <meta property="og:title" content="GreenoFig - Your Professional Health Companion" />
    <meta property="og:description" content="Achieve your wellness goals with personalized nutrition, fitness, and lifestyle coaching." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://greenofig.com" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GreenoFig - Your Professional Health Companion" />
    <meta name="twitter:description" content="Achieve your wellness goals with personalized nutrition, fitness, and lifestyle coaching." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <title>GreenoFig - Your Professional Health Companion</title>

    <!-- Loading screen styles -->
    <style>
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a0f0a 0%, #111711 50%, #0a0f0a 100%);
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #app-loader.light-mode {
        background: linear-gradient(135deg, #f8faf8 0%, #ffffff 50%, #f0f4f0 100%);
      }
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader img {
        width: 120px;
        height: auto;
        animation: pulse 1.5s ease-in-out infinite;
      }
      #app-loader .loader-text {
        margin-top: 20px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #65a30d;
        letter-spacing: 2px;
      }
      #app-loader .loader-dots {
        display: flex;
        gap: 6px;
        margin-top: 16px;
      }
      #app-loader .loader-dot {
        width: 8px;
        height: 8px;
        background-color: #65a30d;
        border-radius: 50%;
        animation: bounce 1.4s ease-in-out infinite;
      }
      #app-loader .loader-dot:nth-child(1) { animation-delay: 0s; }
      #app-loader .loader-dot:nth-child(2) { animation-delay: 0.2s; }
      #app-loader .loader-dot:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); }
      }
    </style>

    <!-- Prevent flash of wrong theme -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('greenofig-theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
          // Add light mode class to loader
          document.addEventListener('DOMContentLoaded', function() {
            const loader = document.getElementById('app-loader');
            if (loader) loader.classList.add('light-mode');
          });
        }

        // Set direction based on saved language
        const savedLang = localStorage.getItem('greenofig-lang') || 'en';
        document.documentElement.lang = savedLang;
        document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
      })();
    </script>
  </head>
  <body>
    <!-- Loading screen with logo -->
    <div id="app-loader">
      <img src="/logo.png" alt="GreenoFig" />
      <div class="loader-dots">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
