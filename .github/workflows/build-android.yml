name: Build signed Android APK

# Triggers
#   - Tag push  : v* (e.g. v0.0.1) → full release build, uploaded to the
#     GitHub Release that already exists for the tag.
#   - workflow_dispatch : manual trigger so you can produce an unsigned
#     debug APK or a signed release APK without cutting a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build type (debug or release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web app build deps (for next/package.json read)
        run: |
          cd next
          npm ci --no-audit --no-fund

      - name: Install mobile deps
        run: |
          cd mobile
          npm install --no-audit --no-fund

      - name: Sync version from next/package.json → version.json
        run: |
          cd mobile
          npm run sync:version

      - name: Generate Android project
        run: |
          cd mobile
          # Symlink www/ exists; cap add picks the webDir from capacitor.config.ts
          npx cap add android
          npx cap sync android

      - name: Generate launcher icons from mobile/resources/icon.png
        run: |
          cd mobile
          # @capacitor/assets reads resources/icon.png (1024x1024) and
          # produces every mipmap-* density variant Android needs.
          # Source icon ships in the repo at mobile/resources/icon.png.
          npm run assets:generate

      - name: Patch AndroidManifest with com.greenofig.app:// intent filter
        run: |
          cd mobile
          # OAuth deep-link return. Adds an <intent-filter> on the
          # MainActivity for the custom scheme so providers like Google
          # can redirect back into the app after sign-in. Idempotent.
          npm run patch:manifest

      - name: Patch build.gradle with the synced versionName/versionCode
        run: |
          cd mobile
          npm run sync:version

      - name: Decode signing keystore (release builds only)
        if: ${{ github.event_name == 'push' || inputs.buildType == 'release' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for release builds."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/mobile/android/app/greenofig-release.jks"
          cat > "$GITHUB_WORKSPACE/mobile/android/keystore.properties" <<EOF
          storeFile=greenofig-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Inject signing config into app/build.gradle (release only)
        if: ${{ github.event_name == 'push' || inputs.buildType == 'release' }}
        run: |
          GRADLE="$GITHUB_WORKSPACE/mobile/android/app/build.gradle"
          # Idempotent: only add the block if it isn't already there.
          if ! grep -q 'signingConfigs.release' "$GRADLE"; then
            node "$GITHUB_WORKSPACE/mobile/scripts/inject-signing.mjs" "$GRADLE"
          fi

      - name: Assemble debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.buildType == 'debug' }}
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Assemble release APK (signed)
        if: ${{ github.event_name == 'push' || inputs.buildType == 'release' }}
        run: |
          cd mobile/android
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          set -e
          if [ "${{ inputs.buildType }}" = "debug" ]; then
            APK=$(ls mobile/android/app/build/outputs/apk/debug/*.apk | head -1)
          else
            APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          fi
          NAME="greenofig-$(node -p "require('./mobile/version.json').versionName").apk"
          cp "$APK" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tag-driven runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true

      # ── Publish APK to greenofig.com via Vercel ───────────────────
      # Copies the freshly-built APK into next/public/downloads/ at
      # the stable filename greenofig-0.0.1.apk (the URL the website
      # points at), then commits + pushes back to main. The push
      # triggers a Vercel deploy that makes the new APK live at
      # https://greenofig.com/downloads/greenofig-0.0.1.apk.
      #
      # Skipped on debug builds — debug APKs aren't signed for distribution.
      - name: Publish APK to next/public/downloads/
        if: ${{ github.event_name == 'push' || inputs.buildType == 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Work on a fresh checkout of main so the commit lands cleanly
          # even when this run was triggered by a tag.
          git fetch origin main:refs/remotes/origin/main
          git checkout -B ci-publish-apk refs/remotes/origin/main
          mkdir -p next/public/downloads
          cp "${{ steps.apk.outputs.path }}" "next/public/downloads/greenofig-0.0.1.apk"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add next/public/downloads/greenofig-0.0.1.apk

          if git diff --cached --quiet; then
            echo "[publish-apk] No change to APK — nothing to commit."
            exit 0
          fi

          git commit -m "ci: publish ${{ steps.apk.outputs.name }} to web"
          git push origin HEAD:main
