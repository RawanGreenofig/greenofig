name: Reminders scheduler

# Drives the in-app reminder scheduler. Vercel's built-in cron is
# plan-limited (Hobby = once/day), so we trigger from GitHub Actions
# instead, every ~10 minutes. The endpoint itself de-dups per day, so
# occasional delayed/extra runs are harmless.
#
# Setup (one-time): add a repo secret named CRON_SECRET whose value
# equals the OPENCLAW_WEBHOOK_SECRET configured in the Vercel project.
# Settings → Secrets and variables → Actions → New repository secret.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes (UTC)
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder dispatch
        run: |
          curl -fsS -X POST "https://greenofig.com/api/cron/reminders" \
            -H "x-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 60
